<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>(function(){var t;try{t=localStorage.getItem('donna-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);if(/[?&]device=phone/.test(location.search)){var r=document.documentElement.style;r.setProperty('--sat','54px');r.setProperty('--sab','34px');}})();</script>
<title>Donna · Service Manager Support</title>
<style>
  :root{
    --bg:#f5f5f7; --bg-hi:#ffffff; --bg-lo:#e8e8ed; --card:#ffffff; --fill:#ededf0; --fill2:#e3e3e8;
    --sep:rgba(60,60,67,.16); --label:#1d1d1f; --label2:#6e6e73;
    --accent:#0066cc; --accent-fill:#0066cc; --on-accent:#ffffff;
    --green:#1a7f37; --red:#c9182b; --amber:#a64a00; --amber2:#a64a00;
    --green-fill:#34c759; --red-fill:#ff3b30; --orange-fill:#ff9500;
    --muted:var(--label2); --line:var(--sep);
    --bubble:#e9e9eb; --glass:rgba(250,250,252,.72); --glass-line:rgba(0,0,0,.06);
    --shadow:0 12px 40px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.04);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;
    color-scheme:light;
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  }
  :root[data-theme=dark]{
    color-scheme:dark;
      --bg:#000000; --bg-hi:#26262a; --bg-lo:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c;
      --sep:rgba(84,84,88,.55); --label:#f5f5f7; --label2:#a1a1a6;
      --accent:#4da3ff; --accent-fill:#0a7aff; --on-accent:#ffffff;
      --green:#32d74b; --red:#ff6961; --amber:#ffb340; --amber2:#ffb340;
      --green-fill:#30d158; --red-fill:#ff453a; --orange-fill:#ff9f0a;
      --bubble:#2c2c2e; --glass:rgba(30,30,32,.66); --glass-line:rgba(255,255,255,.08);
      --shadow:0 12px 40px rgba(0,0,0,.6);
  }
  @media (prefers-contrast:more){ :root{ --label2:var(--label); --sep:var(--label2); --glass:var(--card) } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--label);background:radial-gradient(120% 90% at 50% 38%,var(--bg-hi) 0%,var(--bg) 52%,var(--bg-lo) 100%);-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- SCENE ---------- */
  .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 96px;transition:transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  .scene > *{pointer-events:auto}
  body.has-right .scene{transform:translateX(-215px)}
  body.has-left .scene{transform:translateX(215px)}
  body.has-left.has-right .scene{transform:none}
  .hero{text-align:center;margin-bottom:clamp(8px,3vh,28px);max-width:520px}
  .eyebrow{font-size:17px;font-weight:600;color:var(--label2);margin:0}
  h1{font-family:var(--font-display);font-size:clamp(44px,7vh,72px);line-height:1.04;font-weight:700;letter-spacing:-.03em;margin:2px 0 10px}
  .say{font-size:clamp(17px,2.4vh,21px);line-height:1.38;color:var(--label2);margin:0 auto;min-height:2.8em;max-width:30ch;transition:opacity .25s ease}
  .say.fade{opacity:0}
  .orb-wrap{display:flex;flex-direction:column;align-items:center;position:relative}
  .orb{width:min(300px,38vh);aspect-ratio:1;border-radius:50%;position:relative;cursor:pointer;background:#000;will-change:transform;-webkit-tap-highlight-color:transparent;
    box-shadow:0 0 0 1px rgba(255,255,255,.07),0 0 calc(40px + 80px*var(--glow,.3)) rgba(255,150,50,calc(var(--glow,.3)*.55)),0 40px 90px -30px rgba(0,0,0,.55)}
  .orb:focus-visible{outline:3px solid var(--accent);outline-offset:8px;border-radius:50%}
  .orb canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
  .orb-glass{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,transparent 60%,rgba(255,255,255,.05) 74%,rgba(255,255,255,.20) 97%,rgba(255,255,255,.32) 100%),
               radial-gradient(ellipse 36% 14% at 42% 13%,rgba(255,255,255,.22),rgba(255,255,255,0) 72%),
               radial-gradient(ellipse 30% 12% at 60% 90%,rgba(255,255,255,.08),rgba(255,255,255,0) 70%);
    box-shadow:inset 0 -24px 50px rgba(0,0,0,.55),inset 0 10px 30px rgba(255,255,255,.05)}
  .orb-floor{width:70%;height:22px;margin-top:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),rgba(0,0,0,0));transition:opacity .3s}
  [data-theme=dark] .orb-floor{background:radial-gradient(closest-side,rgba(255,150,50,calc(var(--glow,.3)*.35)),rgba(255,150,50,0))}
  .nameplate{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.32em;color:var(--label2);padding-left:.32em}

  /* entrance */
  .hero > *, .orb-wrap{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .hero .eyebrow{animation-delay:.05s}.hero h1{animation-delay:.15s}.hero .say{animation-delay:.25s}.orb-wrap{animation-delay:.1s}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .theme{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--label)}
  .theme:hover{background:var(--fill)}
  .theme svg{width:19px;height:19px}
  .theme .moon{display:block}.theme .sun{display:none}
  [data-theme=dark] .theme .moon{display:none}[data-theme=dark] .theme .sun{display:block}
  .tr{display:flex;align-items:center;gap:2px}

  /* ---------- GLASS BARS (functional layer only) ---------- */
  .glass{background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--glass-line);box-shadow:0 4px 24px rgba(0,0,0,.06)}
  @media (prefers-reduced-transparency:reduce){ .glass{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none} }
  .top{position:fixed;top:calc(14px + max(env(safe-area-inset-top,0px),var(--sat,0px)));left:16px;right:16px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
  .top > *{pointer-events:auto}
  .mark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;padding:6px 14px 6px 8px;border-radius:999px;letter-spacing:-.01em}
  .seg{display:flex;gap:2px;padding:4px;border-radius:999px}
  .seg button{border:0;background:transparent;font-weight:600;font-size:14px;padding:8px 18px;border-radius:999px;min-height:36px;display:flex;align-items:center;gap:7px;color:var(--label);transition:background .2s}
  .seg button:hover{background:var(--fill)}
  .seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--accent)}
  .seg svg{width:17px;height:17px}
  .status[hidden],.note[hidden]{display:none}
  .status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--label2);padding:9px 14px;border-radius:999px}
  .status i{width:7px;height:7px;border-radius:50%;background:var(--label2)}
  .status.live i{background:var(--green-fill)}
  .tabbar{display:none}

  /* ---------- PANELS ---------- */
  .panel{position:fixed;top:72px;bottom:44px;width:min(420px,calc(100vw - 32px));background:var(--card);border-radius:22px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
  [data-theme=dark] .panel{border:1px solid rgba(255,255,255,.07)}
  .panel.right{right:16px}.panel.left{left:16px}
  .panel.hidden.right{transform:translateX(110%);opacity:0;pointer-events:none;visibility:hidden}
  .panel.hidden.left{transform:translateX(-110%);opacity:0;pointer-events:none;visibility:hidden}
  .grab{display:none}
  .ph{display:flex;align-items:center;gap:8px;padding:16px 14px 10px 20px;min-height:58px}
  .ph h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1}
  .back{border:0;background:none;color:var(--accent);font-size:15px;font-weight:500;padding:6px 8px 6px 2px;margin-left:-6px;display:flex;align-items:center;gap:2px;min-height:36px}
  .back[hidden]{display:none}
  .x{border:0;background:var(--fill);color:var(--label2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
  .x:hover{background:var(--fill2)}
  .x svg{width:12px;height:12px}

  /* chat */
  .msgs{flex:1;overflow:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:6px}
  .m{max-width:84%;padding:9px 14px;border-radius:19px;word-wrap:break-word;animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
  .m.d{background:var(--bubble);align-self:flex-start;border-bottom-left-radius:6px}
  .m.u{background:var(--accent-fill);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:6px;margin-top:6px}
  .m.d + .m.u, .m.u + .m.d{margin-top:8px}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .m p{margin:.3em 0}.m ul,.m ol{margin:.3em 0;padding-left:1.25em}.m li{margin:.15em 0}.m h4{margin:.4em 0 .2em;font-size:15px;font-weight:600}
  .m table{border-collapse:collapse;font-size:13px;margin:.4em 0;width:100%}.m td,.m th{border-bottom:1px solid var(--sep);padding:5px 4px;text-align:left;vertical-align:top}.m th{font-weight:600;color:var(--label2)}
  .m code{background:var(--fill2);padding:0 4px;border-radius:5px}
  .typing{display:inline-flex;gap:4px;padding:5px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--label2);opacity:.5;animation:dot 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,100%{opacity:.3}40%{opacity:.9}}
  .chips{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--fill);border-radius:999px;padding:0 14px;min-height:34px;font-size:13.5px;font-weight:500}
  .chip:hover{background:var(--fill2)}
  form.ask{display:flex;align-items:flex-end;gap:8px;margin:0 12px 6px;padding:5px 5px 5px 14px;border:1px solid var(--sep);border-radius:22px;background:var(--card)}
  form.ask textarea{flex:1;resize:none;border:0;background:transparent;padding:7px 0;font-size:15px;height:34px;max-height:120px;outline:none}
  form.ask button{border:0;width:30px;height:30px;border-radius:50%;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center;flex:none;margin-bottom:2px;transition:background .2s,opacity .2s}
  form.ask button:disabled{background:var(--fill2);color:var(--label2)}
  .note{font-size:12px;color:var(--label2);padding:0 20px 12px;text-align:center}

  /* grouped lists (toolkit, my day) */
  .scroll{flex:1;overflow:auto;padding:0 16px 20px}
  .gh{font-size:13px;font-weight:600;color:var(--label2);margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.02em}
  .group{background:var(--fill);border-radius:14px;overflow:hidden}
  [data-theme=dark] .group{background:#2c2c2e}
  .cell{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:50px;width:100%;border:0;background:transparent;text-align:left;position:relative}
  .cell + .cell:before{content:"";position:absolute;top:0;right:0;left:56px;height:1px;background:var(--sep)}
  .group.plain .cell + .cell:before{left:14px}
  button.cell:hover{background:var(--fill2)}
  .ico{width:30px;height:30px;border-radius:8px;background:var(--card);display:grid;place-items:center;flex:none;color:var(--label)}
  .ico svg{width:17px;height:17px}
  .ct{flex:1;min-width:0}.ct b{display:block;font-weight:600;font-size:15px}.ct span{display:block;font-size:13px;color:var(--label2);line-height:1.35}
  .chev{color:var(--label2);flex:none}
  .lead{font-size:15px;color:var(--label2);margin:0 4px 4px}
  .field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 14px;min-height:48px;position:relative}
  .field + .field:before{content:"";position:absolute;top:0;right:0;left:14px;height:1px;background:var(--sep)}
  .field label{font-size:15px;flex:1}
  .field input{width:110px;border:0;background:transparent;text-align:right;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;padding:10px 0;outline:none}
  .field input:focus{color:var(--label)}
  .out{background:var(--fill);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px}
  [data-theme=dark] .out{background:#2c2c2e}
  .out .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--sep)}
  .out .row:last-child{border:0}
  .out b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .out .sub, .sub{color:var(--label2);font-size:13px}
  .kpi{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--sep);font-size:14px;line-height:1.4}
  .kpi:last-of-type{border-bottom:0}
  .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px}
  .g{background:var(--green-fill)}.r{background:var(--red-fill)}.a{background:var(--orange-fill)}
  .tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:4px;white-space:nowrap}
  .tag.g{background:transparent;color:var(--green);box-shadow:inset 0 0 0 1px currentColor}.tag.r{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px currentColor}
  .btn2{margin-top:14px;border:0;background:var(--accent-fill);color:var(--on-accent);font-weight:600;font-size:15px;border-radius:12px;min-height:44px;padding:0 16px;width:100%}
  .btn2:hover{filter:brightness(1.06)}
  .meter{height:6px;border-radius:99px;background:var(--fill2);overflow:hidden;margin:6px 0 4px}.meter i{display:block;height:100%;border-radius:99px}
  .big{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  /* my day */
  .dayhead{display:flex;align-items:center;gap:14px;padding:4px 4px 2px}
  .dayhead b{display:block;font-size:17px;font-weight:600}.dayhead span{font-size:13px;color:var(--label2)}
  .chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:48px;cursor:pointer;position:relative;font-size:15px;line-height:1.38}
  .chk + .chk:before{content:"";position:absolute;top:0;right:0;left:48px;height:1px;background:var(--sep)}
  .chk input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label2);margin:0;display:grid;place-items:center;cursor:pointer;background:transparent;transition:background .15s,border-color .15s}
  .chk input:checked{background:var(--accent-fill);border-color:var(--accent-fill)}
  .chk input:checked:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .chk input:checked + span{color:var(--label2)}
  .tip{background:var(--fill);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--label2);margin-top:18px}
  [data-theme=dark] .tip{background:#2c2c2e}
  .tip b{color:var(--label)}


  /* learn tray */
  .pseg{display:flex;margin:0 16px 10px;background:var(--fill);border-radius:10px;padding:2px;flex:none}
  .pseg button{flex:1;border:0;background:transparent;font-size:13px;font-weight:600;padding:0 4px;min-height:32px;border-radius:8px;color:var(--label)}
  .pseg button[aria-selected=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14)}
  [data-theme=dark] .pseg button[aria-selected=true]{background:#636366}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-fill);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
  .badge[hidden]{display:none}
  .me{display:flex;align-items:center;gap:14px;padding:4px 4px 6px}
  .me .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(145deg,#ffb340,#ff7a3d);flex:none}
  .me b{display:block;font-size:17px;font-weight:600}.me span{font-size:13px;color:var(--label2)}
  .field input.wide{width:62%;color:var(--label);text-align:right}
  .field input.wide::placeholder,.ti::placeholder,.ta::placeholder{color:var(--label2);opacity:.75}
  .foot{font-size:12.5px;color:var(--label2);margin:8px 4px 0;line-height:1.45}
  .drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:20px 16px;border-radius:14px;border:1.5px dashed var(--label2);color:var(--label2);cursor:pointer;transition:background .15s,border-color .15s;margin-top:4px}
  .drop b{color:var(--accent);font-size:15px;font-weight:600}.drop span{font-size:13px}
  .drop:hover,.drop.over{background:var(--fill);border-color:var(--accent)}
  .drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0;font-size:15px}
  .row2.in{margin:0;padding:8px 14px 10px;border-top:1px solid var(--sep);font-size:14px;color:var(--label2)}
  .sel{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:500;text-align:right;padding:6px 2px;max-width:60%;cursor:pointer}
  .ti{width:100%;border:0;background:transparent;padding:13px 14px;font-size:15px;outline:none;border-bottom:1px solid var(--sep)}
  .ta{width:100%;border:0;background:transparent;resize:vertical;min-height:72px;padding:12px 14px;font-size:15px;line-height:1.4;outline:none;display:block}
  .group:focus-within{box-shadow:0 0 0 2px var(--accent)}
  .btn3{margin-top:10px;border:0;background:var(--fill);color:var(--accent);font-weight:600;font-size:15px;border-radius:12px;min-height:44px;width:100%}
  .btn3:hover{background:var(--fill2)}
  .file,.lesson,.sug{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;position:relative}
  .file + .file:before,.lesson + .lesson:before,.sug + .sug:before{content:"";position:absolute;top:0;right:0;left:14px;height:1px;background:var(--sep)}
  .file.off .ct b,.file.off .kind{opacity:.5}
  .kind{flex:none;width:38px;height:38px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--label2)}
  .file .ct b,.lesson .ct b,.sug .ct b{font-weight:600;font-size:15px;word-break:break-word}
  .frow{display:flex!important;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .frow .sel{text-align:left;max-width:none;padding-left:0;font-size:13px}
  .sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--label2);cursor:pointer;margin-left:auto}
  .sw input{appearance:none;-webkit-appearance:none;width:38px;height:23px;border-radius:12px;background:var(--fill2);position:relative;cursor:pointer;margin:0;transition:background .2s}
  .sw input:after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .sw input:checked{background:var(--green-fill)}.sw input:checked:after{transform:translateX(15px)}
  .del{flex:none;border:0;background:var(--fill2);color:var(--label2);min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:12px;font-weight:600;padding:0 8px}
  .del:hover{color:var(--red)}
  .del.armed,.cell.danger.armed{background:var(--red-fill);color:#fff}
  .cell.danger b{color:var(--red)}
  .empty{background:var(--fill);border-radius:14px;padding:16px;font-size:14px;color:var(--label2);text-align:center}
  [data-theme=dark] .empty{background:#2c2c2e}
  .sug .sb{display:flex;gap:6px;flex:none;align-self:center}
  .ghost,.prim{border:0;border-radius:999px;font-size:13px;font-weight:600;min-height:30px;padding:0 12px}

<script>
/* ================= KNOWLEDGE ================= */
const KNOWLEDGE = `
ROLE: Service Manager (SM) delivers Student SUCCESS and SATISFACTION; success+satisfaction = Internal Revenue (renewals + referrals, up to 50% of Center objective). Four Bests: People (SM selects/trains ~2/3 of staff), Atmosphere, Method, Service. Six areas: HR & People; Communication; Management of Progress, Satisfaction & Profitability; Platforms & Tools; Leadership; Sales support. Mantra: "Inspect what you expect." Works with Center Director/Sales Manager; escalates to Regional/National Service Manager. Service team = SM, Coaches (formerly Personal Tutors), Teachers, and Receptionists where they exist.
OFFICIAL WSE GLOBAL ROLE PROFILE (Service Manager): Reports to the Centre Director. Has overall responsibility for the delivery of service and the educational experience for Students in the Centre: the ambassador and leader of educational excellence. Leads the Service team (Teachers, Personal Tutors/Coaches, Receptionists) to give a consistent premium experience, which strengthens the brand and brings business stability through renewals and referrals; works in synergy with the Centre Director and sales team on internal sales (renewals and friends-and-family referrals). Spends much of the time overseeing each function against SOP and suggesting improvements so service always exceeds expectation; coaches and trains the team with passion.
Essential duties: (1) lead the Service team to deliver a premium educational experience; (2) create an environment where Students AND alumni are inspired to engage with English in-center, online and in real life; (3) manage day-to-day Service and guarantee smooth operations; (4) guarantee learning through quality control and promoting the WSE Method; (5) make sure SOP is followed at all times for global brand consistency; (6) teach according to Center needs and lead by example; (7) partner with the Centre Director for a strong Service-Sales partnership, premium experience and internal sales targets; (8) work with HR on people development strategies for continuous development, retention and premium results; (9) work with the Corporate Sales Team so Corporate Students get the same learning experience in-center or offsite at company locations, managing these courses; (10) track, analyze and report Center Service performance and provide solutions for improvement areas; (11) make sure Student satisfaction and learning levels exceed benchmarks; (12) control educational standards by teaching Encounters, Complementary Classes, Social Club activities and First/Second Lessons; (13) drive the in-center community with a monthly Social Club calendar; (14) drive engagement of staff, Students and alumni in informal learning communities using digital tools, social media and in-center promotion; (15) implement new products and systems when required; (16) recruit, train and develop Service staff; (17) motivate and coach Centre staff to give premium service; (18) keep the optimum number of staff and schedule them to Student needs; (19) identify key improvement areas and implement the right changes; (20) give timely, accurate reports to the Centre Director; (21) maintain the Center's image and IT assets. Minimum requirements: native or bilingual English speaker, university degree, CELTA or equivalent TEFL certificate. The list is a snapshot, not exhaustive.

SERVICE KPIs (Power BI Student Progress Daily/Monthly): Active Students Serviced % 75% (did 1 Multimedia mini cycle or 1 Encounter in period). Active Booked % 80% (active last 30 days and booked into future Encounter; Daily report only). Active Students Serviced Done 1+ Encounter 85%. Total Serviced Done 1+ 60%+. Monthly Progress Ratio (Encounters per active Student) target 1.6, healthy 1.33-2.0. First Encounter in 3 Weeks 80%. Average Levels Completed 2.5+ (Monthly only). Monthly report available day 5.
EFFICIENCY KPIs (Class Efficiency / Class Planner BI): Classes Offered within 5% of recommendation; Students per Class = dynamic global average, max 4 per Encounter; Classes Given % 96%; No Show Rate under 15% (online no-shows still billed); Encounter Success Rate = % Continue.
Benchmark = expected result when SOP followed. Below = red flag to investigate (observations, meetings, talking to Students, teaching, working Coach tasks). Always exceeded = too easy.
Red flag causes: Active% -> follow-up/motivation, class quality, onboarding. Active Booked -> Coaches not booking next Encounter, not enough self-booking slots (Center Configuration). Done1+/MPR -> too few classes or wrong times, Action List prioritization, booking technique. First Enc 3 wks -> Welcome Session quality, 48h start, First Level follow-up. Classes Given/No show/Students per class -> over-scheduling, schedule built for Teachers not Students, not confirming single-Student classes.

STUDY HABITS: 1 Lesson per session (3 mini cycles within 24h); Digital Student Workbook after each Lesson; all 3 Lessons before Encounter; 1 Encounter every 2 weeks; 1 Level every 2 months; 1 CC + 1 Social Club per Unit.

CUSTOMER JOURNEY: Beginning (build habits, overcome fears, complete one Level, relationship, referrals): Welcome Session/First Lesson, First Encounter, First Level Advising Session + appointments; proactive First Encounter messaging, reactive onboarding/progress/inactive messaging, Action List. Middle: Encounters, CCs, Social Clubs, End of Level Advising Sessions. End: maximize remaining time, compare progress to goal, renew: End of Level Advising, Graduation, Renewal Appointment, Renewables. Goal 80% touchpoints completed. Client Fidelity Plan = structured feedback/follow-up.
FIRST LEVEL SUCCESS: completing First Level within 90 days => 38% more likely to renew. Start within 48h of login; memorable Welcome Session; First Encounter within 3 weeks; Action List follow-up; First Level Progress Report (Coach tab); goals in daily/weekly/monthly meetings; celebrate. Student responsibilities: trust Method, use it as designed, open to new ideas, comfortable with uncertainty, take risks, regular study, plan time.

REFERRALS: best moment = first month, after Welcome Session and First Encounter. ~1 referral lead per new Student; funnel 80% booked, 80% shown, 33% signed; target referral contracts ~25% of new contracts. Example 100 leads->80->64->21 contracts x $1500 = $31,500. Lever: Social Clubs/events (only class content designed by Center; based on Student interests; invite prospects/referrals; monthly calendar published week 4 of previous month; yearly plan, monthly themes, new-Student party, budget & ROI).
RENEWALS: 20-30% of end contracts (aim 25-30%); renewals+referrals 40-50% of sales; annual target split over 12 months; quarterly/annual bonus. 10 steps: (1) week 3 SM downloads Renewables report (ending within 90 days); (2) week 3 SM flags hot leads (2.5+ Levels, ending within 90 days) in Action List Excel; (3) week 3 CD/Sales Manager + SM set Center & individual targets; (4) day 1 present at General Staff Meeting: Service books & confirms 80% of renewables, Sales renews 20-30%, weekly numbers; (5) day 1 SM assigns leads in shared online Renewables tracker; (6) weekly Coaches book: 90-60 days study advice, 60-30 days study advice or Consultant by progress (~10 Encounters), 30 days Consultant; (7) daily Consultants prep progress/grades/goals, propose new goals, update tracker, flag no-shows; (8) track contacted/booked/shows/objections (Service) and shows/contracts/objections (Sales); (9) weekly CD+SM review; (10) month-end reflection & celebration. Bonus ROI example: 1067 end contracts x30% = 320 x $1200 = $384,000; bonus 10% of $1400 = $140/month/Coach, $16,800/yr for 10 Coaches; ROI $367,200.

COST: not only cutting; invest where ROI. Levers: efficient class offering, right staff numbers, teaching spend (scheduling, Students/class), Global Online Center spend, yearly budget incl. bonus, internal revenue. Class planning inputs: total Students, % active, Students per class type, classes per Student per month, working days, % online, access type, seasonality. Tools: Class Planner Power BI + Class Planner Excel (steps: workdays & Students; prediction model; activities & classes; % online; Students per class). Month-end Class Efficiency review; cost of late cancellations/no-shows. Global Online Classroom reduces Teacher cost. Teaching budget 10% of revenue. SM responsible for service headcount. Coach model: one person for booking, motivation, language support; up to 150 Students per Coach. Teacher true cost: recruitment, travel, relocation, visas, housing, salary, benefits, payroll taxes. Situation analysis before hiring; know the decision-maker.

SCHEDULING TEACHERS: classes from Class Planner; time bands default 30% morning (opening-lunch) / 20% afternoon / 50% evening, localize after 3-6 months; evenings & Saturday mornings peak. SM assigns CC/SC Levels by active Student Level distribution (Class Planner BI 'Student Distribution by Level'); Encounters first-come first-served. Rotate rare-Level CCs across bands over 2-3 weeks; push small Levels to online Center. Recheck distribution every 3-6 months. Fair schedule: blocks 2-3h (max 4), few split shifts, early start=early finish, late finish=late start, max 2 blocks/day, fair mix of EN/CC/SC, share evenings & weekends; Students' needs first, no favoritism, part-timers cover peaks. Example 72 classes: 22/14/36 by band; 55 EN, 10 CC, 7 SC.
SCHEDULING COACHES: 5 tasks: welcoming visitors, Teaching Support in Center, Welcome Sessions, Advising Sessions, Student Follow-Up. Min one Coach in Center at all times; extra Teaching Support at peak when 25+ Students need help; fair distribution; vary shifts; sessions at peak. Formulas (sessions 30 min, 4.3 weeks/month): New Students = projected revenue / average contract price; WS hours = new Students/2; WS per week = new Students/4.3. Advising per month = active Students x 85% / 3; hours = /2; per week = /4.3. Follow-up weekly hours = Students x 3 min / 60; monthly = weekly x 4.3; Coaches contact 20-30 Students/hour, each Student weekly. Order: shifts, WS, AS, then follow-up. Rotate weekly. Ensure delivery via training, QC, observations, weekly reviews, feedback, targets, managing by walking around.

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(_){ return d } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(_){} } };
function md(src){
  const lines = esc(src).split(/\n/); let html='', list=null, table=null;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>');
  const close = () => { if(list){html+=`</${list}>`;list=null} if(table){html+='</table>';table=null} };
  for(const raw of lines){
    const l = raw.trim();
    if(/^\|.*\|$/.test(l)){
      if(/^\|[\s:\-|]+\|$/.test(l)) continue;
      if(list){html+=`</${list}>`;list=null}
      const cells = l.slice(1,-1).split('|').map(c=>inline(c.trim()));
      if(!table){table=1;html+='<table><tr>'+cells.map(c=>`<th>${c}</th>`).join('')+'</tr>'}
      else html+='<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>';
      continue;
    }
    if(table){html+='</table>';table=null}
    let m;
    if((m=l.match(/^[-•]\s+(.*)/))){ if(list!=='ul'){close();html+='<ul>';list='ul'} html+=`<li>${inline(m[1])}</li>`; continue }
    if((m=l.match(/^\d+[.)]\s+(.*)/))){ if(list!=='ol'){close();html+='<ol>';list='ol'} html+=`<li>${inline(m[1])}</li>`; continue }
    close();
    if((m=l.match(/^#{1,4}\s+(.*)/))){ html+=`<h4>${inline(m[1])}</h4>`; continue }
    if(l) html+=`<p>${inline(l)}</p>`;
  }
  close(); return html;
}

const FILES={ list:[], db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('donna',1); r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'}); r.onsuccess=()=>{ this.db=r.result; res(true) }; r.onerror=()=>res(false); r.onblocked=()=>res(false); }catch(_){ res(false) } }) },
  async load(){
    if(!this.db && !(await this.open())){ this.list=store.get('donna-files-fallback',[]); return; }
    this.list=await new Promise(res=>{ const out=[]; try{ const tx=this.db.transaction('files'); tx.objectStore('files').openCursor().onsuccess=e=>{ const c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out); }; tx.onerror=()=>res(out); }catch(_){ res(out) } });
    this.list.sort((a,b)=>b.added-a.added);
  },
  async put(f){
    const i=this.list.findIndex(x=>x.id===f.id); if(i>=0) this.list[i]=f; else this.list.unshift(f);
    const {_chunks,...rec}=f;
    if(this.db) await new Promise(r=>{ try{ const tx=this.db.transaction('files','readwrite'); tx.objectStore('files').put(rec); tx.oncomplete=r; tx.onerror=r; }catch(_){ r() } });
    else store.set('donna-files-fallback',this.list.map(({_chunks,...x})=>x));
    onLearn();
  },
  async remove(id){
    this.list=this.list.filter(x=>x.id!==id);
    if(this.db) await new Promise(r=>{ try{ const tx=this.db.transaction('files','readwrite'); tx.objectStore('files').delete(id); tx.oncomplete=r; tx.onerror=r; }catch(_){ r() } });
    else store.set('donna-files-fallback',this.list.map(({_chunks,...x})=>x));

const loadScript=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load the reader. Check your internet connection.')); document.head.appendChild(s); });
const htmlToText=h=>{ const d=new DOMParser().parseFromString(h,'text/html'); d.querySelectorAll('script,style,noscript').forEach(x=>x.remove()); return (d.body&&d.body.textContent)||''; };
async function readFileText(file){
  const name=file.name.toLowerCase();
  if(/\.html?$/.test(name)) return htmlToText(await file.text());
  if(/\.(txt|md|markdown|csv|tsv|json|log)$/.test(name) || (file.type||'').startsWith('text/')) return await file.text();
  if(/\.pdf$/.test(name)){
    if(!window.pdfjsLib){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; let out='';
    for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); out+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n\n'; }
    return out;
  }
  if(/\.docx$/.test(name)){
    if(!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;
  }
  throw new Error('Donna can read PDF, Word (.docx), text, Markdown, CSV, JSON and HTML files.');
}

  await FILES.put(f); return f;
}

function chunksOf(f){
  if(f._chunks) return f._chunks;
  const out=[]; let cur='';
  for(const p of f.text.split(/\n\s*\n/)){ const t=p.trim(); if(!t) continue;
    if(cur && (cur.length+t.length)>800){ out.push(cur); cur=t; } else cur=cur?cur+'\n'+t:t;
    while(cur.length>1200){ out.push(cur.slice(0,1000)); cur=cur.slice(1000); } }
  if(cur) out.push(cur);
  return f._chunks=out.map(c=>({text:c,set:new Set(toks(c))}));
}
function searchFiles(q,topic,k=4){
  const qt=[...new Set(toks(q))], pool=[];
  for(const f of FILES.list){ if(f.active) for(const c of chunksOf(f)) pool.push({f,c}); }
  const N=pool.length||1, w={};   // rare words count more than common ones
  for(const t of qt){ let df=0; for(const x of pool) if(x.c.set.has(t)) df++; w[t]=Math.log(1+N/(df||N)); }
  const res=[];
  for(const {f,c} of pool){ const linked=topic && f.topic===topic; let s=0;
    for(const t of qt) if(c.set.has(t)) s+=w[t];
    if(!s){ if(!linked) continue; s=.35; } else s=s/Math.sqrt(qt.length||1)+(linked?.6:0);
    res.push({f,c,s,w}); }
  return res.sort((a,b)=>b.s-a.s).slice(0,k);
}
function lessonHits(q,topic,k=3){
  const qt=new Set(toks(q));
  return MEM.lessons.map(l=>{ let s=0; for(const w of toks(l.text)) if(qt.has(w)) s++; if(topic&&l.topic===topic) s+=1.5; return {l,s}; })
    .filter(x=>x.s>=1).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.l);
}
function excerpt(text,q,len=260){
  const t=text.replace(/\s+/g,' ').trim(), lo=t.toLowerCase(), qt=[...new Set(toks(q))];
  const hits=[]; for(const w of qt){ let i=-1; while((i=lo.indexOf(w,i+1))>=0) hits.push([i,w]); }
  let best=0, bestScore=-1;   // the window holding the most different query words
  for(const [i] of hits){ const from=Math.max(0,i-60), seen=new Set(); for(const [j,w] of hits) if(j>=from&&j<from+len) seen.add(w); const sc=seen.size*1000-i; if(sc>bestScore){ bestScore=sc; best=from; } }
  let start=best; if(start){ const sp=t.lastIndexOf('. ',start+40); if(sp>start-80&&sp>0) start=sp+2; }
  return (start?'…':'')+t.slice(start,start+len).replace(/[|#*`]/g,' ').trim()+(start+len<t.length?'…':'');
}

/* ---------- Donna's built-in guide as searchable passages (offline brain) ---------- */
let _guide=null;
function guidePool(){
  if(_guide) return _guide;
  const out=[], push=(label,text,topic)=>{ text=text.replace(/\|?\s*-{3,}\s*/g,' ').replace(/\s*\|\s*/g,' · ').replace(/\s+/g,' ').replace(/(·\s*){2,}/g,'· ').replace(/^· |(· )+$/g,'').trim(); if(text.length>25) out.push({label,text,topic,set:new Set(toks(label+' '+text))}); };
  for(const line of KNOWLEDGE.split('\n')){ const l=line.trim(); if(!l) continue;
    const m=l.match(/^([A-Z][A-Za-z0-9 &()\/.,'+-]{2,70}):\s*(.*)$/), label=m?m[1]:'Guide', body=m?m[2]:l.replace(/^-\s*/,'');
    let cur='';   // long lines become ~350-character passages, cut at sentence ends
    for(const part of body.split(/(?<=[.;])\s+(?=[A-Z(0-9])/)){ if(cur && cur.length+part.length>350){ push(label,cur); cur=part; } else cur=cur?cur+' '+part:part; }
    if(cur) push(label,cur); }
  for(const [t,txt] of Object.entries(TOPICS)) for(const sec of txt.split(/\n(?=#{2,4} |\*\*)/)) push(t,sec.replace(/^#+\s*/,''),t);
  return _guide=out;
}
/* everyday words a Service Manager uses, mapped to the words in her guide */
const SYN=[[/stop(s|ped)? (coming|studying)|drop(ping)? out|disengag|inactive|not coming|absent|lazy|quit/,'active follow-up motivation churn engagement action list'],
  [/class size|students per|how many students/,'max students class efficiency'],[/motivat|morale|engag(e|ing) (my|the) (team|staff)/,'praise develop leadership recognition'],
  [/late|cancel/,'noshow rebook'],[/angry|upset|unhappy/,'complaint'],[/new student|onboard|first week/,'welcome first encounter first level'],
  [/sell|upsell|extend|extension/,'renewal'],[/friend|recommend/,'referral'],[/hire|recruit|interview/,'recruit selection people'],[/train(ing)?\b/,'training observation development']];
function searchGuide(q,k=3){
  const ql=String(q).toLowerCase(), extra=SYN.filter(([re])=>re.test(ql)).map(([,w])=>w).join(' ');
  const qt=[...new Set(toks(q+' '+extra))]; if(!qt.length) return [];
  const pool=guidePool(), N=pool.length, w={};
  for(const t of qt){ let df=0; for(const x of pool) if(x.set.has(t)) df++; w[t]=df?Math.log(1+N/df):0; }
  const known=qt.filter(t=>w[t]>0).length, res=[];
  for(const x of pool){ let s=0, n=0; for(const t of qt) if(x.set.has(t)){ s+=w[t]; n++; } if(n) res.push({x,s:s/Math.sqrt(qt.length)*(n>1?1.2:1)}); }
  res.sort((a,b)=>b.s-a.s);
  const top=res.length?res[0].s:0, seen=new Set();
  return { hits:res.filter(r=>r.s>=top*.55 && !seen.has(r.x.text.slice(0,80)) && seen.add(r.x.text.slice(0,80))).slice(0,k), known, total:qt.length };
}
const niceLabel=l=>(l=l.replace(/\s*\(.*?\)/g,'').trim())==='Guide'?'From my guide':l.charAt(0)+l.slice(1).toLowerCase().replace(/\b(sm|kpis?|sos|wse|sop|nps|csat|it)\b/g,m=>m.toUpperCase().replace('KPIS','KPIs'));
function smallTalk(q){

  if(/^(thanks|thank you|thx|cheers|great|perfect|ok|okay|cool)\b/.test(s) && s.split(/\s+/).length<=4) return `Anytime${n?', '+n:''}.`;
  if(/^(who|what) are you|what can you do|^help$|how do (you|i use)/.test(s)) return `I'm **Donna**, your Service Manager partner. I can:\n- Explain any part of the job: KPIs, renewals, referrals, First Level Success, scheduling, observations, complaints, budget.\n- Run the numbers in the **Toolkit** (KPI Health Check, Student Risk Radar, sessions, renewals…).\n- Keep **My Day** with your tasks and checks.\n- Learn from your files and lessons in **Learn**.`;
  if(/^how are you/.test(s)) return `Glowing, thanks${n?', '+n:''}. What are we working on?`;
  return null;
}

const KPI_CHECKS={'Active Students Serviced':'Work the inactive Students on the Action List','Active Booked':'Check every Coach contact ends with the next Encounter booked','Active Done 1+':'Check peak-time Encounter availability for the next 5 days','Total Done 1+':'Call Students with no Encounter yet this month','Monthly Progress Ratio':'Check that Students due an Encounter this week are booked','First Encounter in 3 weeks':'Check new Students without a First Encounter booked','Classes Given':'Merge or cancel empty classes in the next 5 days','No Show Rate':"Call yesterday's no-shows and rebook them"};
const TOPIC_CHECKS={'Renewals process':['Check the Renewables tracker: booked vs target','week'],'Complaints':['Follow up every open complaint within 48 hours','day'],'Referrals':["Ask this week's new Students for a referral",'week'],'First Level Success':['Check First Level Students on the Action List','day'],'Coach scheduling':['Check Coach cover at peak times','day'],'Teacher scheduling':["Review next week's Teacher schedule",'week'],'Observations':["Book this week's observations",'week'],'Cost & budget':['Check empty classes and no-show cost','week'],'Corporate Students':['Check corporate courses and client reports','week'],'Community & alumni':['Post on Center community channels','week'],'KPI benchmarks':['Check Student Progress Daily against targets','day'],'Meetings':['Prepare the agenda for this week\'s Service Meeting','week'],'Action plan':['Review Action Plan milestones','week']};
function suggestions(){
  const out=[], e=MEM.exp, have=new Set(MEM.checks.map(c=>c.text.toLowerCase())), dis=new Set(MEM.dismissed);
  const push=(text,freq,why)=>{ const k=text.toLowerCase(); if(!have.has(k)&&!dis.has(k)&&!out.some(o=>o.text.toLowerCase()===k)) out.push({text,freq,why}); };
  if(e.kpi&&e.kpi.labels) e.kpi.labels.forEach(l=>{ if(KPI_CHECKS[l]) push(KPI_CHECKS[l],'day',`${l} was below benchmark in your KPI Health Check on ${fmtDate(e.kpi.date)}.`); });
  if(e.risk&&e.risk.score<50) push('Review at-risk Students with their Coach','day',`A Student scored ${e.risk.score} (at risk) in the Student Risk Radar on ${fmtDate(e.risk.date)}.`);
  Object.entries(e.topics||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([t,n])=>{ if(n>=2&&TOPIC_CHECKS[t]) push(TOPIC_CHECKS[t][0],TOPIC_CHECKS[t][1],`You asked me about ${t} ${n} times.`); });
  MEM.lessons.forEach(l=>{ const m=l.text.match(/\b(?:every\s*day|daily)\b[,:]?\s*(.{6,})/i); if(m) push(cap(clean(m[1])),'day',`From something you taught me on ${fmtDate(l.at)}.`); });
  const old=openTasks().filter(t=>t.date<localDay()); if(old.length>=2) push('Block 30 minutes for tasks carried over','day',`${old.length} tasks have carried over from earlier days.`);
  if((e.feedback||{}).down>=3) push('Teach Donna one thing that works differently here','week','A few of my answers were not quite right for your Center.');
  return out.slice(0,8);
}

/* ---------- things Donna can say about what she knows ---------- */
function aboutMe(){
  const p=MEM.profile, e=MEM.exp, L=MEM.lessons, C=MEM.checks;
  if(!p.name && !L.length && !FILES.list.length) return "I don't know much about you yet. Tell me your name, or open **Learn** to teach me.";
  const lines=[];
  if(p.name) lines.push(`- You're **${p.name}**${p.role?', '+p.role:''}${p.center?' at '+p.center:''}.`);
  if(p.team) lines.push(`- Your team: ${p.team}.`);
  if(p.hours) lines.push(`- You usually work ${p.hours}.`);
  if(p.priorities) lines.push(`- Your priorities: ${p.priorities}.`);
  lines.push(`- I've learned **${L.length}** lesson${L.length===1?'':'s'}, read **${FILES.list.length}** file${FILES.list.length===1?'':'s'}, and keep **${C.length}** check${C.length===1?'':'s'} of your own.`);
  const top=Object.entries(e.topics||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]); if(top.length) lines.push(`- You ask me most about ${top.join(' and ')}.`);

function myDaySummary(){
  const T=dayTasks(), open=T.filter(t=>!t.done), n=hostName();
  let s=`### ${n?n+"'s":'Your'} day\n`;
  s+= open.length ? open.map(t=>'- '+t.text+(t.date<localDay()?' *(from '+fmtDate(t.date)+')*':'')).join('\n') : '- No open tasks. Add one by saying "Add task …".';
  const C=MEM.checks.filter(c=>c.freq==='day'); if(C.length) s+='\n\n**Your daily checks:**\n'+C.map(c=>'- '+c.text).join('\n');
  const S=suggestions(); if(S.length) s+=`\n\nI also have **${S.length}** suggested check${S.length>1?'s':''} for you in **Learn › Daily**.`;

}

/* ---------- chat commands: teach Donna in plain words ---------- */
function handleCommand(q){
  const s=q.trim(); let m;
  if((m=s.match(/^(?:my name is|call me|you can call me)\s+([^\s,.!?][^,.!?\n]{0,30})/i))){ const p=MEM.profile; p.name=cap(clean(m[1])); MEM.setProfile(p); onLearn(); renderDay(); return `Nice to meet you, **${p.name}**. I'll remember that.`; }
  if((m=s.match(/^(?:please\s+)?remember(?:\s+that)?[:,]?\s+([\s\S]{3,})/i))){ const l=addLesson(m[1],'chat',topicFor(m[1])||''); return l?`Got it. I'll remember that ${l.text.charAt(0).toLowerCase()+l.text.slice(1)}.\n\nYou can see everything I've learned in **Learn › Lessons**.`:null; }
  if((m=s.match(/^(?:every\s*day|daily)[,:]?\s+(?:i\s+(?:need|want|have)\s+to\s+|please\s+)?(?:remind me to\s+)?([\s\S]{3,})/i))){ const c=addCheck(m[1],'day'); return c?`Added to your daily checks: **${c.text}**. It's in **My Day** now.`:`That's already one of your checks.`; }
  if((m=s.match(/^(?:every\s*week|weekly)[,:]?\s+(?:remind me to\s+)?([\s\S]{3,})/i))){ const c=addCheck(m[1],'week'); return c?`Added to your weekly checks: **${c.text}**.`:`That's already one of your checks.`; }
  if((m=s.match(/^(?:every\s*month|monthly)[,:]?\s+(?:remind me to\s+)?([\s\S]{3,})/i))){ const c=addCheck(m[1],'month'); return c?`Added to your monthly checks: **${c.text}**.`:`That's already one of your checks.`; }
  if((m=s.match(/^(?:add (?:a )?task|add to my (?:day|list)|to-?do|remind me to|today i (?:need|have) to)[:,]?\s+([\s\S]{3,})/i))){ const parts=m[1].split(/\s*[;\n]\s*/).filter(Boolean); parts.forEach(x=>addTask(x)); return `Added to today's list: ${parts.map(x=>'**'+cap(clean(x))+'**').join(', ')}.`; }
  if(/^(?:what do you know about me|who am i|what have you learned)\??$/i.test(s)) return aboutMe();
  if(/^(?:my day|what'?s on my plate( today)?|what do i have( to do)? today|my tasks)\??$/i.test(s)) return myDaySummary();
  return null;
}

    orb.style.transform=`translate3d(${off.x.toFixed(1)}px,${off.y.toFixed(1)}px,0) scale(${sc.toFixed(4)})`;
    draw(dt,still);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

const TOPIC_MAP=[["complain","Complaints"],["angry","Complaints"],["upset","Complaints"],["unhappy","Complaints"],["refund","Complaints"],["corporate","Corporate Students"],["company","Corporate Students"],["offsite","Corporate Students"],["alumni","Community & alumni"],["community","Community & alumni"],["social media","Community & alumni"],["social club","Community & alumni"],["role","My role profile"],["job description","My role profile"],["responsib","My role profile"],["duties","My role profile"],["duty","My role profile"],["celta","My role profile"],["report to","My role profile"],["it asset","My role profile"],["best","Best-in-class habits"],["habit","Best-in-class habits"],["churn","Best-in-class habits"],["risk","Best-in-class habits"],["study planner","Best-in-class habits"],["level","Levels & classes"],["waystage","Levels & classes"],["threshold","Levels & classes"],["kpi","KPI benchmarks"],["benchmark","KPI benchmarks"],["renew","Renewals process"],["referr","Referrals"],["first level","First Level Success"],["first encounter","First Level Success"],["coach","Coach scheduling"],["welcome","Coach scheduling"],["advising","Coach scheduling"],["teacher","Teacher scheduling"],["schedul","Teacher scheduling"],["observ","Observations"],["feedback","Observations"],["complain","Complaints"],["meeting","Meetings"],["action plan","Action plan"],["sos","Action plan"],["cost","Cost & budget"],["budget","Cost & budget"],["headcount","Cost & budget"]];
function topicFor(q){ const s=String(q).toLowerCase(); if(TOPICS[q]) return q; if(/\b(hire|hiring|recruit|interview)/.test(s)) return null; for(const [k,t] of TOPIC_MAP) if(s.includes(k)) return t; return null; }
function localAnswer(q,topic){

  const t=topic||topicFor(q), H0=searchFiles(q,t,3), top=H0.length?H0[0].s:0, H=H0.filter(h=>h.s>=Math.max(.6,top*.6)), L=lessonHits(q,t);

async function ask(q){

    const text=(res&&res.text)||'';

    history.push({role:'assistant',content:text});
    if(text){ bubbleEl.dataset.n=++msgN; addFeedback(bubbleEl,q,topic); }
    say("Done. Anything else?",1800);
  }catch(e){
    if(e&&e.code==='rate_limited'){ bubbleEl.innerHTML=md("I'm getting a lot of questions right now. Ask again in a minute."); }
    else if(e&&e.code==='not_granted'){ sample=null; setMode(); bubbleEl.innerHTML=md(localAnswer(q,topic)); }
    else bubbleEl.innerHTML=md((e&&e.text)||"I couldn't reach my live answers. Try again, or pick a topic below.");

}

async function localSample(req,{signal,onText}){

  if(!res.ok){ let j={}; try{ j=await res.json(); }catch(_){} throw {code:res.status===503?'not_granted':(j.code||'error'), text:j.text}; }
  const rd=res.body.getReader(), dec=new TextDecoder(); let text='';

const n = v => { const x=parseFloat(String(v).replace(/[, ]/g,'')); return isFinite(x)?x:0; };
const f1 = x => (Math.round(x*10)/10).toLocaleString();
const f0 = x => Math.round(x).toLocaleString();
const TOOLS = {
  "KPI Health Check": {

      const spec=[["act","Active Students Serviced",75,">=","Push Action List follow-up on inactive Students; check onboarding and class quality."],
        ["book","Active Booked",80,">=","Coaches must book the next Encounter at every contact; check self-booking slots."],
        ["done","Active Done 1+",85,">=","Check class availability at peak times and Action List priorities."],
        ["tot","Total Done 1+",60,">=","Re-engage inactive Students; review the schedule vs the Class Planner."],

        ["fe","First Encounter in 3 weeks",80,">=","48-hour start, memorable Welcome Sessions, First Level follow-up."],

        ["ns","No Show Rate",15,"<","Confirm bookings, rebook yesterday's no-shows, build a booking culture."]];

      for(const [k,label,b,op,tip] of spec){

        total++;
        const x=n(raw), ok= op==='>='? x>=b : x<b;
        if(!ok) redLabels.push(label);
        if(!ok) reds.push(`${label} ${raw}${k==='mpr'?'':'%'} (benchmark ${op==='<'?'under ':''}${b}${k==='mpr'?'':'%'})`);

      }

      const g=total-reds.length;
      html=`<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big" style="color:${reds.length?'var(--red)':'var(--green)'}">${g}/${total}</span><span class="sub" style="margin:0">KPIs on benchmark</span></div><div class="meter"><i style="width:${g/total*100}%;background:${reds.length?'var(--orange-fill)':'var(--green-fill)'}"></i></div>`+html;

      setTimeout(()=>{ const b=$('#askKpi'); if(b) b.onclick=()=>{ openPanel('chat'); ask(`My red KPIs this month: ${reds.join('; ')}. Diagnose the likely causes and give me a SMART action plan for the next 4 weeks with owners and weekly milestones.`); }; },0);
      return html;
    }
  },
  "Student Risk Radar": {
    sub:"Check one Student against the recommended study habits and spot drop-out or renewal risk early.",
    fields:[["start","Days since contract start","45"],["lvl","Levels completed","0"],["enc","Encounters in last 30 days","1"],["idle","Days since last study activity","9"],["booked","Next Encounter booked? (1 = yes, 0 = no)","0"],["ns","No-shows in last 30 days","1"],["left","Days left on contract","300"]],
    calc(v){
      const start=n(v.start), lvl=n(v.lvl), enc=n(v.enc), idle=n(v.idle), booked=n(v.booked), ns=n(v.ns), left=n(v.left);
      const sig=[]; let score=100;
      const add=(pts,sev,txt,act)=>{ score-=pts; sig.push([sev,txt,act]); };
      if(start<=21 && enc===0) add(15,'a','No First Encounter yet (day '+start+' of 21).','Coach calls today and books the First Encounter.');

      const band = score>=75?['Healthy','var(--green)']:score>=50?['Watch','var(--amber2)']:['At risk','var(--red)'];
      let html=`<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big" style="color:${band[1]}">${score}</span><b style="color:${band[1]}">${band[0]}</b></div><div class="meter"><i style="width:${score}%;background:${band[1]}"></i></div>`;

      html+= sig.length? sig.map(([s,t,a])=>`<div class="kpi"><span class="dot ${s}" role="img" aria-label="${s==='r'?'High risk':s==='a'?'Watch':'Good sign'}"></span><div><b>${t}</b><br>${a}</div></div>`).join('') : `<p><b>On track.</b> Praise the habit and ask for a referral.</p>`;
      html+=`<p class="sub" style="margin:10px 0 0">Tip: compare a Student with their own usual pace too. A sudden slowdown is the earliest warning sign.</p>`;
      return html;

  const f=e.feedback||{}; if(f.up||f.down) out.push(`My answers: ${f.up} helpful, ${f.down} not quite.`);
  const done=MEM.tasks.filter(t=>t.done).length; if(MEM.tasks.length) out.push(`Tasks: ${done} done of ${MEM.tasks.length} added.`);
  return out.length?out:['Nothing yet. I learn from the topics you ask about, the tools you use, your feedback and your tasks.'];
}

function learnFiles(el){
  const F=FILES.list;
  el.innerHTML=`<p class="lead">Give Donna your Center's own documents: SOPs, targets, schedules, scripts. Link each one to a topic so she uses it with her built-in knowledge.</p>
    <label class="drop" id="drop" for="fileIn"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><b>Add Files</b><span>PDF, Word, text, CSV, JSON or HTML · or drop them here</span><input type="file" id="fileIn" multiple accept=".pdf,.docx,.txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.log,text/*" class="sr"></label>
    <div class="row2"><label for="newTopic">Link new files to</label><select id="newTopic" class="sel">${topicOptions('General')}</select></div>
    <p class="foot" id="fileStatus" aria-live="polite"></p>
    <div class="gh">Write a Note</div><div class="group plain"><input class="ti" id="noteTitle" placeholder="Title (optional)" autocomplete="off" aria-label="Note title"><textarea class="ta" id="noteText" rows="3" placeholder="Paste or type anything Donna should know: a policy, a target, a script…" aria-label="Note text"></textarea></div>
    <button type="button" class="btn3" id="noteSave">Save Note</button>
    <div class="gh">Donna's Files (${F.length})</div>
    ${F.length?`<div class="group plain">${F.map(f=>`<div class="file${f.active?'':' off'}"><span class="kind">${KIND_ICON[f.kind]||'FILE'}</span><span class="ct"><b>${esc(f.name)}</b><span>${f.kind==='note'?'Note':kb(f.size)} · ${chunksOf(f).length} part${chunksOf(f).length===1?'':'s'} · added ${fmtDate(new Date(f.added).toISOString())}</span>
      <span class="frow"><label class="sr" for="ft_${f.id}">Linked topic for ${esc(f.name)}</label><select class="sel" id="ft_${f.id}" data-ftopic="${f.id}">${topicOptions(f.topic)}</select>
      <label class="sw"><input type="checkbox" data-factive="${f.id}" ${f.active?'checked':''}><span>${f.active?'In use':'Paused'}</span></label>
      <button type="button" class="del" data-fdel="${f.id}" aria-label="Delete ${esc(f.name)}">${ICON_X}</button></span></span></div>`).join('')}</div>`:`<div class="empty">No files yet. Add your first one above.</div>`}`;
  const status=$('#fileStatus');
  const take=async files=>{ for(const file of files){ status.textContent=`Reading ${file.name}…`; try{ const f=await learnFile(file,$('#newTopic').value); status.textContent=`Learned ${f.name} (${chunksOf(f).length} parts).`; say(`I've read ${f.name}.`,2200); }catch(err){ status.textContent=`${file.name}: ${err.message}`; } } renderLearn(); };
  $('#fileIn').onchange=e=>{ take([...e.target.files]); e.target.value=''; };
  const drop=$('#drop');
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>take([...e.dataTransfer.files]));
  $('#noteSave').onclick=async()=>{ const f=await learnNote($('#noteTitle').value,$('#noteText').value,$('#newTopic').value); if(!f){ $('#noteText').focus(); return; } status.textContent=`Saved note: ${f.name}.`; renderLearn(); };
  el.querySelectorAll('[data-ftopic]').forEach(s=>s.onchange=()=>{ const f=FILES.list.find(x=>x.id===s.dataset.ftopic); f.topic=s.value; FILES.put(f); });
  el.querySelectorAll('[data-factive]').forEach(c=>c.onchange=()=>{ const f=FILES.list.find(x=>x.id===c.dataset.factive); f.active=c.checked; FILES.put(f); });
  el.querySelectorAll('[data-fdel]').forEach(b=>twoStep(b,'Delete',()=>FILES.remove(b.dataset.fdel)));
}

function learnLessons(el){
  const L=MEM.lessons.slice().reverse(), src={chat:'From chat',feedback:'From feedback',manual:'Taught here'};
  el.innerHTML=`<p class="lead">Teach Donna how things work in your Center. She follows these in every answer and tells you when one differs from the standard.</p>
    <div class="group plain"><textarea class="ta" id="lessonText" rows="3" placeholder="e.g. Our Center closes at 21:00 on Saturdays." aria-label="New lesson"></textarea>
    <div class="row2 in"><label for="lessonTopic">Topic</label><select id="lessonTopic" class="sel">${topicOptions('General')}</select></div></div>
    <button type="button" class="btn2" id="lessonSave">Teach Donna</button>
    <p class="foot">In chat, start with <b>"Remember that…"</b>. Tap <b>Not Quite</b> under an answer to correct her.</p>
    <div class="gh">What Donna Has Learned (${L.length})</div>
    ${L.length?`<div class="group plain">${L.map(l=>`<div class="lesson"><span class="ct"><b>${esc(l.text)}</b><span>${src[l.source]||'Taught'} · ${fmtDate(l.at)}${l.topic&&l.topic!=='General'?' · '+esc(l.topic):''}</span></span><button type="button" class="del" data-ldel="${l.id}" aria-label="Forget this lesson">${ICON_X}</button></div>`).join('')}</div>`:`<div class="empty">Nothing yet. Your first lesson will show here.</div>`}`;
  $('#lessonSave').onclick=()=>{ const t=$('#lessonTopic').value; const l=addLesson($('#lessonText').value,'manual',t==='General'?'':t); if(!l){ $('#lessonText').focus(); return; } say("Learned. Thank you.",1800); renderLearn(); };
  el.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>{ MEM.setLessons(MEM.lessons.filter(x=>x.id!==b.dataset.ldel)); onLearn(); renderLearn(); });
}

function learnDaily(el){
  const S=suggestions(), C=MEM.checks;
  el.innerHTML=`<p class="lead">Your own checks join Donna's operating rhythm in My Day. She also suggests checks from how you work: your KPI results, the topics you ask about, and what you teach her.</p>
    <div class="gh">Donna Suggests</div>
    ${S.length?`<div class="group plain">${S.map((s,i)=>`<div class="sug"><span class="ct"><b>${esc(s.text)}</b><span>${esc(FREQ[s.freq])} · ${esc(s.why)}</span></span><span class="sb"><button type="button" class="ghost" data-sno="${i}">Not Now</button><button type="button" class="prim" data-sok="${i}">Add</button></span></div>`).join('')}</div>`:`<div class="empty">No suggestions right now. Run a KPI Health Check or keep chatting, and Donna will spot patterns.</div>`}
    <div class="gh">Add Your Own Check</div><div class="group plain"><input class="ti" id="chkText" placeholder="e.g. Check the reception all-English standard" autocomplete="off" aria-label="New check">
    <div class="row2 in"><span>How often</span><span class="segm" role="radiogroup" aria-label="How often">${Object.entries(FREQ).map(([k,v],i)=>`<label><input type="radio" name="chkFreq" value="${k}" ${i===0?'checked':''}><span>${v}</span></label>`).join('')}</span></div></div>
    <button type="button" class="btn2" id="chkSave">Add Check</button>
    <div class="gh">Your Checks (${C.length})</div>
    ${C.length?`<div class="group plain">${C.map(c=>`<div class="lesson"><span class="ct"><b>${esc(c.text)}</b><span>${FREQ[c.freq]}${c.why?' · '+esc(c.why):''}</span></span><button type="button" class="del" data-cdel="${c.id}" aria-label="Remove this check">${ICON_X}</button></div>`).join('')}</div>`:`<div class="empty">None yet. In chat you can also say <b>"Every day check…"</b>.</div>`}`;
  el.querySelectorAll('[data-sok]').forEach(b=>b.onclick=()=>{ const s=S[b.dataset.sok]; addCheck(s.text,s.freq,s.why); say(`Added: ${s.text}.`,2000); renderLearn(); });
  el.querySelectorAll('[data-sno]').forEach(b=>b.onclick=()=>{ const s=S[b.dataset.sno]; MEM.setDismissed([...MEM.dismissed,s.text.toLowerCase()]); renderLearn(); renderDay(); });
  $('#chkSave').onclick=()=>{ const f=(el.querySelector('input[name=chkFreq]:checked')||{}).value||'day'; const c=addCheck($('#chkText').value,f); if(!c){ $('#chkText').focus(); return; } renderLearn(); };
  el.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ MEM.setChecks(MEM.checks.filter(x=>x.id!==b.dataset.cdel)); onLearn(); renderLearn(); renderDay(); });
}

/* ---------- backup, restore, forget ---------- */
function exportMemory(){
  const data={app:'donna',version:1,exported:new Date().toISOString(),profile:MEM.profile,lessons:MEM.lessons,checks:MEM.checks,tasks:MEM.tasks,exp:MEM.exp,dismissed:MEM.dismissed,files:FILES.list.map(({_chunks,...f})=>f)};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download=`donna-memory-${localDay()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function importMemory(file){
  let d; try{ d=JSON.parse(await file.text()); }catch(_){ alert('That file is not a Donna backup.'); return; }
  if(!d || d.app!=='donna'){ alert('That file is not a Donna backup.'); return; }
  if(!confirm('Replace everything Donna knows with this backup? What she knows now will be replaced.')) return;
  const arr=x=>Array.isArray(x)?x:[], obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  MEM.setProfile(obj(d.profile)); MEM.setLessons(arr(d.lessons)); MEM.setChecks(arr(d.checks)); MEM.setTasks(arr(d.tasks)); MEM.setExp(obj(d.exp)); MEM.setDismissed(arr(d.dismissed));
  await FILES.clear(); for(const f of arr(d.files)) if(f&&f.id&&typeof f.text==='string') await FILES.put(f);
  OB.step='done'; onLearn(); renderLearn(); renderDay(); setChips(); say(hostName()?`Welcome back, ${hostName()}.`:'Backup restored.',2400);
}
async function forgetAll(){
  for(const k of KEYS) try{ localStorage.removeItem(k) }catch(_){}
  await FILES.clear(); onLearn(); renderLearn(); renderDay();
  msgs.innerHTML=''; history.length=0; startOnboarding(); openPanel('chat');
}

/* ---------- start ---------- */
document.querySelectorAll('#learnTabs button').forEach(b=>b.onclick=()=>{ learnTab=b.dataset.lt; renderLearn(); });
$('#learnTabs').addEventListener('keydown',e=>{ if(!['ArrowLeft','ArrowRight'].includes(e.key)) return; const bs=[...document.querySelectorAll('#learnTabs button')], i=bs.findIndex(b=>b.dataset.lt===learnTab), j=(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length; learnTab=bs[j].dataset.lt; renderLearn(); bs[j].focus(); });
(async()=>{
  await FILES.load();
  renderDay(); renderLearn(); onLearn();
  if(!hostName() && OB.step!=='done'){ startOnboarding(); }
  else {
    const n=hostName();
    addMsg('assistant', md(`${n?`Welcome back, **${n}**.`:`Hi, I'm **Donna**.`} I can help with KPIs, renewals and referrals, scheduling, observations, complaints, meetings, budgets and action plans.\n\nPick a topic below, ask in your own words, or teach me something new.`));
    setChips();
    setTimeout(()=>say(greetingLine(),2800),1400);
  }
})();
function greetingLine(){
  const n=hostName(), h=new Date().getHours(), part=h<12?'Good morning':h<18?'Good afternoon':'Good evening', open=openTasks().length;
  if(!n) return greetings[0];
  return `${part}, ${n}. `+(open?`You have ${open} task${open>1?'s':''} on today's list.`:'What are we working on today?');
}
